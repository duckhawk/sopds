name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        run: >-
          pytest
          --cov=opds_catalog --cov=sopds_web_backend --cov=book_tools --cov=sopds
          --cov-report=term-missing
          --cov-fail-under=65

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install ruff

      - name: ruff
        run: ruff check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pip-audit

      # Advisory for now (does not block the merge) while the pinned versions
      # flagged in review are triaged; tighten to blocking once clean.
      - name: pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true
